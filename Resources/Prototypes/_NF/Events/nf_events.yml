- type: entity
  id: NFBaseStationEventModerateDelay
  parent: BaseGameRule
  abstract: true
  components:
    - type: GameRule
      delay:
        min:  30
        max:  40

- type: entity
  id: NFBluespaceCargoCrate
  parent: NFBaseStationEventModerateDelay
  components:
  - type: StationEvent
    startAnnouncement: bluespace-cargo-event-announcement
    startAudio:
      path: /Audio/_NF/Announcements/PocketSizedAndy/andy2_bluespace_normal_crate.ogg
      volume: 0
    weight: 5
    duration: 35
    minimumPlayers: 30 # Kritters 0<30 this keeps flooding people with junk
    reoccurrenceDelay: 480 #Kritters 180<480 (now 8 hours)
  - type: BluespaceCargoRule
    spawnerPrototype: RandomCargoSpawner
    flashPrototype: EffectFlashBluespaceQuiet
    requireSafeAtmosphere: true
    minimumSpawns: 2
    maximumSpawns: 3

- type: entity
  id: NFBluespaceMcCargoCrate
  parent: NFBaseStationEventModerateDelay
  components:
  - type: StationEvent
  #Todo add path to  start warning and end Voiceover
    startAnnouncement: bluespace-cargo-event-announcement
    startAudio:
      path: /Audio/_NF/Announcements/PocketSizedAndy/andy2_bluespace_normal_crate.ogg
    earliestStart: 20
    weight: 5
    duration: 35
    maximumPlayers: 20
    minimumPlayers: 5 # Kritters 0<5 this keeps flooding people with junk, food is kinda nice though
    reoccurrenceDelay: 480 #Kritters 180<480 (now 8 hours)
  - type: BluespaceCargoRule
    spawnerPrototype: CrateFoodMcCargo
    flashPrototype: EffectFlashMcBluespace
    requireSafeAtmosphere: true

- type: entity
  id: NFBluespaceSyndicateCrate
  parent: NFBaseStationEventModerateDelay
  components:
  - type: StationEvent
    startAnnouncement: bluespace-syndicate-crate-event-announcement
    startAudio:
      path: /Audio/_NF/Announcements/PocketSizedAndy/andy2_bluespace_syndie_crate.ogg
    weight: 1
    duration: 35
    earliestStart: 90
    maximumPlayers: 20
    minimumPlayers: 5 # Kritters 0<5 this keeps attacking people with junk
    reoccurrenceDelay: 480 # 8 hours
  - type: BluespaceCargoRule
    spawnerPrototype: CrateSyndicateSurplusBundle
    maximumSpawns: 1

# Kritters: add a low population variant
- type: entity
  id: NFSmugglingFaxLowpop
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    weight: 4 # half as common as NFSmugglingFax
    duration: 35
    earliestStart: 50
    minimumPlayers: 2
    maximumPlayers: 20 # does not exceed the miniumum players of NFSmugglingFax
    reoccurrenceDelay: 480 # 8 hours
  - type: RandomFaxRule
    minFaxes: 1
    maxFaxes: 2
    name: deaddrop-faxed-hint-name
    prototypeId: PaperDeadDropFax
    content: deaddrop-faxed-hint-content # Default contents, will be edited.
    stampedBy:
    - stampedName: deaddrop-faxed-hint-signature
      stampedColor: "#850000"
    stampState: paper_stamp-syndicate
    preFaxActions:
    - !type:GetRandomDeadDropAction


- type: entity
  id: NFSmugglingFax
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    weight: 8 # Fairly common.
    duration: 35
    earliestStart: 50
    minimumPlayers: 20
    reoccurrenceDelay: 50
  - type: RandomFaxRule
    minFaxes: 1
    maxFaxes: 2
    name: deaddrop-faxed-hint-name
    prototypeId: PaperDeadDropFax
    content: deaddrop-faxed-hint-content # Default contents, will be edited.
    stampedBy:
    - stampedName: deaddrop-faxed-hint-signature
      stampedColor: "#850000"
    stampState: paper_stamp-syndicate
    preFaxActions:
    - !type:GetRandomDeadDropAction

- type: entity
  id: NFSmugglingFaxBig
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    #Kritters: what what? why 100?
    weight: 100 # Fairly common.
    minimumPlayers: 10
    duration: 35
  - type: RandomFaxRule
    minFaxes: 3
    maxFaxes: 4
    name: deaddrop-faxed-hint-name
    prototypeId: PaperDeadDropFax
    content: deaddrop-faxed-hint-content # Default contents, will be edited.
    stampedBy:
    - stampedName: deaddrop-faxed-hint-signature
      stampedColor: "#850000"
    stampState: paper_stamp-syndicate
    preFaxActions:
    - !type:GetRandomDeadDropAction
